<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global UniVerse | World University Rankings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="loading" class="loading-overlay">
      <div class="loader"></div>
    </div>

    <div id="app">
      <header>
        <h1>Global UniVerse</h1>
        <p class="subtitle">Interactive World University Rankings Data Explorer</p>
      </header>

      <div class="stats-grid" id="stats">
        <!-- Stats will be injected here -->
      </div>

      <div class="controls card">
        <select id="yearSelect">
          <option value="2016">2016</option>
          <option value="2015">2015</option>
          <option value="2014">2014</option>
          <option value="2013">2013</option>
          <option value="2012">2012</option>
          <option value="2011">2011</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search University or Country...">
      </div>

      <div class="main-content">
        <div class="card">
          <h2>Ranking Comparison</h2>
          <div class="chart-container">
            <canvas id="rankingChart"></canvas>
          </div>
        </div>
        
        <div class="card">
          <h2>Top Countries</h2>
          <div class="chart-container">
            <canvas id="countryChart"></canvas>
          </div>
        </div>
      </div>

      <div class="card ranking-list">
        <h2>Full Rankings</h2>
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>University</th>
              <th>Country</th>
              <th>Score</th>
              <th>Citations</th>
              <th>Research</th>
            </tr>
          </thead>
          <tbody id="rankingBody">
            <!-- Data will be injected here -->
          </tbody>
        </table>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
